  <head>
    <meta name="google-site-verification" content="ro3Wy3Z3mHvXxH3HoZqi3-H47hLHgaml5YlMBP1jSr0" />
    <link rel="stylesheet" href="/silktide-consent-manager.css">
    <style>
      /* Hide Silktide credit/logo */
      .silktide-logo,
      .silktide-consent-manager__banner-credit,
      .silktide-consent-manager__preferences-credit,
      [class*="silktide"][class*="credit"] {
        display: none !important;
      }

      /* ===== Cookie banner — Intini Web Atelier (mattiaintini.com style) ===== */
      #silktide-banner {
        left: 20px !important;
        right: auto !important;
        bottom: 20px !important;
        top: auto !important;
        transform: none !important;
        max-width: 380px !important;
        width: max-content !important;
        background: rgba(15, 15, 16, 0.96) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 14px !important;
        padding: 18px 20px !important;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        backdrop-filter: blur(20px) !important;
        font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
      }
      #silktide-banner p {
        font-size: 13px !important;
        line-height: 1.55 !important;
        color: #a1a1aa !important;
        margin: 0 0 14px 0 !important;
      }
      #silktide-banner p a {
        color: #fff !important;
        text-decoration: underline !important;
        text-underline-offset: 3px !important;
      }
      #silktide-banner .actions {
        display: flex !important;
        flex-wrap: wrap !important;
        align-items: center !important;
        gap: 6px !important;
        margin: 0 !important;
      }
      /* Base button = secondary outline pill */
      #silktide-banner .st-button,
      #silktide-banner .accept-all,
      #silktide-banner .reject-all {
        padding: 8px 14px !important;
        font-size: 12.5px !important;
        font-weight: 500 !important;
        border-radius: 999px !important;
        border: 1px solid rgba(255, 255, 255, 0.14) !important;
        background: transparent !important;
        color: #fff !important;
        box-shadow: none !important;
        min-width: 0 !important;
        transition: background 0.2s ease, opacity 0.2s ease !important;
      }
      #silktide-banner .st-button:hover,
      #silktide-banner .reject-all:hover {
        background: rgba(255, 255, 255, 0.06) !important;
      }
      /* Primary = white-filled */
      #silktide-banner .accept-all {
        background: #fff !important;
        color: #000 !important;
        border-color: #fff !important;
      }
      #silktide-banner .accept-all:hover {
        background: #fff !important;
        opacity: 0.88 !important;
      }
      /* Preferences = quiet text link, own row */
      #silktide-banner .actions-row {
        width: 100% !important;
        margin-top: 4px !important;
      }
      #silktide-banner .preferences {
        background: transparent !important;
        border: none !important;
        padding: 2px 0 !important;
        color: #71717a !important;
        font-size: 12px !important;
      }
      #silktide-banner .preferences span { color: #71717a !important; }
      #silktide-banner .preferences:hover,
      #silktide-banner .preferences:hover span { color: #a1a1aa !important; }

      @media (max-width: 768px) {
        #silktide-banner {
          left: 14px !important;
          right: 14px !important;
          bottom: 14px !important;
          max-width: none !important;
          width: auto !important;
        }
      }

      /* Cookie reopener icon (gear) */
      #silktide-cookie-icon,
      .silktide-cookie-icon,
      .silktide-consent-manager__cookie-icon {
        width: 38px !important;
        height: 38px !important;
      }
    </style>
    <script src="/silktide-consent-manager.js"></script>
    <script>
    silktideCookieBannerManager.updateCookieBannerConfig({
      background: {
        showBackground: false
      },
      cookieIcon: {
        position: "bottomLeft"
      },
      cookieTypes: [
        {
          id: "necessary",
          name: "Necessari",
          description: "<p>Cookie indispensabili per il funzionamento del sito. Non possono essere disattivati.</p>",
          required: true,
          onAccept: function() {}
        },
        {
          id: "analytics",
          name: "Analitici",
          description: "<p>Ci aiutano a capire come viene utilizzato il sito per poterlo migliorare.</p>",
          defaultValue: true,
          onAccept: function() {
            if (typeof gtag !== 'undefined') {
              gtag('consent', 'update', { analytics_storage: 'granted' });
            }
          },
          onReject: function() {
            if (typeof gtag !== 'undefined') {
              gtag('consent', 'update', { analytics_storage: 'denied' });
            }
          }
        },
        {
          id: "advertising",
          name: "Pubblicitari",
          description: "<p>Utilizzati per mostrarti contenuti e annunci pertinenti ai tuoi interessi.</p>",
          onAccept: function() {
            if (typeof gtag !== 'undefined') {
              gtag('consent', 'update', {
                ad_storage: 'granted',
                ad_user_data: 'granted',
                ad_personalization: 'granted'
              });
            }
          },
          onReject: function() {
            if (typeof gtag !== 'undefined') {
              gtag('consent', 'update', {
                ad_storage: 'denied',
                ad_user_data: 'denied',
                ad_personalization: 'denied'
              });
            }
          }
        }
      ],
      text: {
        banner: {
          description: "<p>Utilizziamo cookie tecnici e, previo consenso, cookie analitici per migliorare la tua esperienza. <a href='https://intiniwebatelier.com/cookie-policy' target='_blank'>Cookie Policy</a></p>",
          acceptAllButtonText: "Accetta tutti",
          acceptAllButtonAccessibleLabel: "Accetta tutti i cookie",
          rejectNonEssentialButtonText: "Rifiuta",
          rejectNonEssentialButtonAccessibleLabel: "Rifiuta i cookie non essenziali",
          preferencesButtonText: "Preferenze",
          preferencesButtonAccessibleLabel: "Apri preferenze cookie"
        },
        preferences: {
          title: "Preferenze cookie",
          description: "<p>Puoi scegliere quali tipi di cookie consentire. Le tue preferenze si applicheranno a tutto il sito.</p>",
          creditLinkText: "",
          creditLinkAccessibleLabel: ""
        }
      },
      position: {
        banner: "bottomLeft"
      }
    });
    </script>
